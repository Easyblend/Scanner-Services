
name: Scanner CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "scanner/**"
      - ".github/workflows/ci.yml"

  push:
    branches:
      - main
    paths:
      - "scanner/**"
      - ".github/workflows/ci.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scanner-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test scanner
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: scanner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scanner/package-lock.json

      - name: Install dependencies
        run: npm ci

    #   - name: Run lint
    #     run: npm run lint --if-present

      - name: Run tests
        run: npm test --if-present

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Build application
        run: npm run build
